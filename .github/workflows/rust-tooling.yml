name: Frontend dependency audit
on:
  push:
    branches: [rust-audit-tooling-20260913]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependency graph without scripts
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Record complete audit
        working-directory: frontend
        continue-on-error: true
        run: npm audit --json > ../frontend-audit.json
      - name: Record production dependency audit
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev --json > ../frontend-production-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-dependency-audit
          path: |
            frontend-audit.json
            frontend-production-audit.json
          retention-days: 7
