name: Rust audit
on:
  push:
    branches: [rust, rust-audit-20260913]
    paths: ['backend-rust/**', 'frontend/**', 'scripts/rust/**', '.github/workflows/rust-audit.yml']
  pull_request:
    branches: [rust]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        working-directory: backend-rust
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend-rust/target
          key: rust-audit-v2-${{ runner.os }}-${{ hashFiles('backend-rust/Cargo.lock') }}
          restore-keys: rust-audit-v2-${{ runner.os }}-
      - name: Format and lint
        working-directory: backend-rust
        run: |
          set -o pipefail
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee ../rust-clippy.txt
      - name: Tests
        working-directory: backend-rust
        run: |
          set -o pipefail
          cargo test --locked --all-targets 2>&1 | tee ../rust-tests.txt
      - name: Release build
        working-directory: backend-rust
        run: |
          set -o pipefail
          cargo build --locked --release --bins 2>&1 | tee ../rust-build.txt
      - name: Source archive
        run: git archive --format=zip --prefix=campus-policy-agent/ HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-verification-${{ github.sha }}
          path: |
            source.zip
            rust-clippy.txt
            rust-tests.txt
            rust-build.txt
          retention-days: 14
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend regression and build
        working-directory: frontend
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ../frontend-install.txt
          npm test 2>&1 | tee ../frontend-tests.txt
          npm run build 2>&1 | tee ../frontend-build.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-verification-${{ github.sha }}
          path: |
            frontend-install.txt
            frontend-tests.txt
            frontend-build.txt
          retention-days: 14
